<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Good Night">
  <defs>
    <linearGradient id="face" x1="0.75" y1="0.1" x2="0.2" y2="0.95">
      <stop offset="0" stop-color="#fff7e6"/>
      <stop offset="0.55" stop-color="#ffdba8"/>
      <stop offset="1" stop-color="#ff9a57"/>
    </linearGradient>
    <mask id="bite">
      <rect width="100" height="100" fill="#fff"/>
      <circle cx="66" cy="38" r="36" fill="#000"/>
    </mask>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <g mask="url(#bite)">
    <circle cx="48" cy="54" r="40" fill="#ffb27a" opacity="0.45" filter="url(#glow)"/>
    <circle cx="48" cy="54" r="40" fill="url(#face)"/>
  </g>
