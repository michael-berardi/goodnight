[package]
name = "goodnight-core"
description = "Good Night's engine: warmth curve, sunrise and sunset, schedule and settings. One implementation for macOS and Windows."
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Michael Berardi"]
publish = false

[lib]
name = "goodnight_core"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
carapace = { git = "https://github.com/michael-berardi/carapace", tag = "v0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

[dev-dependencies]
carapace-codegen = { git = "https://github.com/michael-berardi/carapace", tag = "v0.1.0" }
