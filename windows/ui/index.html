<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Good Night</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <section class="sky" id="sky">
      <canvas class="stars" id="stars"></canvas>
      <div class="sun" id="sun"></div>
      <svg class="moon" id="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </section>

    <header class="titlebar" data-tauri-drag-region>
      <button class="chrome" id="gear" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>
      </button>
      <button class="chrome" id="minimize" title="Minimize" aria-label="Minimize"><svg viewBox="0 0 16 16"><path d="M3 8h10"/></svg></button>
      <button class="chrome close" id="close" title="Close" aria-label="Close"><svg viewBox="0 0 16 16"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg></button>
    </header>

    <div class="hero" data-tauri-drag-region>
      <div class="title" id="title">–</div>
      <div class="subtitle" id="subtitle"></div>
      <label class="switch hero-switch"><input type="checkbox" id="power-flyout" aria-label="Good Night"><span></span></label>
    </div>

    <main class="card" id="card">
      <div class="row head">
        <strong>Good Night</strong>
        <label class="switch"><input type="checkbox" id="power" aria-label="Good Night"><span></span></label>
      </div>
      <div class="bright">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <div class="dial" id="warmth" role="slider" tabindex="0" aria-label="Warmth"><div class="track"></div><div class="knob"><i></i></div></div>
        <svg viewBox="0 0 24 24" class="fill"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </div>
      <div class="bright">
        <svg viewBox="0 0 24 24" class="small"><circle cx="12" cy="12" r="3.5"/><path d="M12 4.5v1.5M12 18v1.5M4.5 12H6M18 12h1.5"/></svg>
        <div class="dial" id="brightness" role="slider" tabindex="0" aria-label="Brightness"><div class="track"></div><div class="knob"><i></i></div></div>
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </div>
      <div class="presets" id="presets"></div>
      <p class="error" id="error" hidden></p>
      <button class="update" id="update-banner" hidden></button>
      <hr>
      <div class="row">
        <div><div>Follow the sun</div><div class="caption" id="next"></div></div>
        <label class="switch"><input type="checkbox" id="follow" aria-label="Follow the sun"><span></span></label>
      </div>
      <footer class="flyout-footer">
        <button class="link" id="open">Open Good Night</button>
        <button class="link" id="quit">Quit</button>
      </footer>
    </main>

    <aside class="sheet" id="sheet" hidden>
      <div class="row head"><strong>Settings</strong><button class="link" id="done">Done</button></div>
      <div class="group">
        <div class="row"><span>Start with Windows</span><label class="switch"><input type="checkbox" id="autostart"><span></span></label></div>
        <div class="row"><span>Follow the sun</span><label class="switch"><input type="checkbox" id="follow2"><span></span></label></div>
      </div>
      <div class="group">
        <div class="row"><span>Location</span><span class="value" id="place"></span></div>
        <div class="row"><span>Today</span><span class="value" id="today"></span></div>
      </div>
      <div class="group">
        <div class="row"><span>Check for updates automatically</span><label class="switch"><input type="checkbox" id="autoupdate"><span></span></label></div>
        <div class="row"><span id="version"></span><button class="link" id="update">Check now</button></div>
      </div>
      <div class="group">
        <div class="row"><span>Warmer · Cooler</span><span class="value keys">Ctrl Alt Shift → · ←</span></div>
        <div class="row"><span>Brighter · Dimmer</span><span class="value keys">Ctrl Alt Shift ↑ · ↓</span></div>
      </div>
      <p class="about" id="about"></p>
    </aside>
  </div>
  <script src="app.js"></script>
</body>
</html>
